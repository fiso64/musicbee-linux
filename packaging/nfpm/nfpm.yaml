name: musicbee
arch: all
platform: linux
version: ${MUSICBEE_VERSION}
release: 1
section: sound
priority: optional
maintainer: fiso64 <sokfilix@gmail.com>
license: GPL-3.0-only
homepage: https://github.com/fiso64/musicbee-linux
description: |
  The MusicBee music player via Wine.
contents:
  - src: src/musicbee-manage.py
    dst: /usr/libexec/musicbee/musicbee-manage.py
    file_info:
      mode: 0755
  - src: packaging/musicbee
    dst: /usr/bin/musicbee
    file_info:
      mode: 0755
  - src: packaging/musicbee-manage
    dst: /usr/bin/musicbee-manage
    file_info:
      mode: 0755
  - src: desktop/musicbee.desktop
    dst: /usr/share/applications/musicbee.desktop
    file_info:
      mode: 0644
  - src: README.md
    dst: /usr/share/doc/musicbee/README.md
    file_info:
      mode: 0644
  - src: LICENSE
    dst: /usr/share/licenses/musicbee/LICENSE
    file_info:
      mode: 0644
overrides:
  deb:
    depends:
      - python3
      - wine | wine-staging | wine-devel | wine-stable
      - winetricks
      - cabextract
      - 7zip | p7zip-full
      - zenity
    recommends:
      - icoutils
  rpm:
    depends:
      - python3
      - wine
      - winetricks
      - cabextract
      - 7zip
      - zenity
    recommends:
      - icoutils
