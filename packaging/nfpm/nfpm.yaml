name: musicbee
arch: all
platform: linux
version: 0.1.0
release: 1
section: sound
priority: optional
license: GPL-3.0-only
homepage: https://github.com/fiso64/musicbee-linux
description: |
  Unofficial MusicBee Portable integration for Linux via Wine.
  Sets up a per-user Wine prefix and runs a user-supplied MusicBee application.
contents:
  - src: src/musicbee.py
    dst: /usr/libexec/musicbee/musicbee.py
    file_info:
      mode: 0755
  - src: packaging/musicbee
    dst: /usr/bin/musicbee
    file_info:
      mode: 0755
  - src: desktop/musicbee.desktop
    dst: /usr/share/applications/musicbee.desktop
    file_info:
      mode: 0644
  - src: README.md
    dst: /usr/share/doc/musicbee/README.md
    file_info:
      mode: 0644
  - src: LICENSE
    dst: /usr/share/licenses/musicbee/LICENSE
    file_info:
      mode: 0644
overrides:
  rpm:
    depends:
      - python3
      - wine
      - winetricks
      - cabextract
      - 7zip
    recommends:
      - icoutils
